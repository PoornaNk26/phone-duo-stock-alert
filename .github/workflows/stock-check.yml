
name: iPhone Duo Stock Check

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to ntfy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: .stock-state
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Install dependencies
        run: pip install requests

      - name: Test cloud notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC" || { echo "NTFY_TOPIC secret is missing"; exit 1; }
          curl --fail --silent --show-error \
            -H "Title: iPhone Duo cloud test" \
            -d "GitHub Actions successfully sent this test from the cloud." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Check pickup stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZIP_CODE: "28027"
          STOCK_STATE_FILE: .stock-state/availability.json
        run: python iphone_duo_pickup_monitor_v3.py --once

      - name: Save previous stock state
        if: always() && hashFiles('.stock-state/availability.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .stock-state
          key: stock-state-${{ github.run_id }}
